services:
  - type: web
    name: priyonix-one-api
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: priyonix
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RESET_PASSWORD
        value: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_REFRESH_COOKIE_SECURE
        value: true
      - key: AUTH_REFRESH_COOKIE_SAME_SITE
        value: None
      - key: AUTH_TRUST_FORWARDED_FOR
        value: true
      - key: ROLE_MIGRATION_ENABLED
        value: true
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: priyonix
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_RESET_LINK_BASE
        sync: false
      - key: MAIL_SMTP_AUTH
        value: true
      - key: MAIL_SMTP_STARTTLS
        value: true
      - key: PASSWORD_RESET_DEV_MODE
        value: false
    healthCheckPath: /api/health
