services:
  - type: web
    name: priyonix-erp-backend
    env: java
    plan: free
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: priyonix
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RESET_PASSWORD
        value: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_REFRESH_COOKIE_SECURE
        value: true
      - key: AUTH_REFRESH_COOKIE_SAME_SITE
        value: None
      - key: AUTH_TRUST_FORWARDED_FOR
        value: true
      - key: ROLE_MIGRATION_ENABLED
        value: true
    healthCheckPath: /api/health
